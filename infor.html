<section class="greeting"><h1>Hi there!</h1><p>Glad you&#39;re here.</p></section><section class="gallery-section gallery-panel" id="gallery-information"><h2>Information</h2><textarea class="information-editor" aria-label="Information text" data-text-key="information-text"></textarea></section>

<section class="numbers" id="library" aria-label="Library image slots"><label class="numbercard image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input type="file" accept="image/*" aria-label="Add image 1"></label><label class="numbercard image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input type="file" accept="image/*" aria-label="Add image 2"></label><label class="numbercard image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input type="file" accept="image/*" aria-label="Add image 3"></label><label class="numbercard image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input type="file" accept="image/*" aria-label="Add image 4"></label></section><section class="gallery-section gallery-panel" id="gallery-price"><h2>Price</h2><label class="large-image image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input data-slot-key="price-image" type="file" accept="image/*" aria-label="Add Price image"></label></section><section class="gallery-section gallery-panel" id="gallery-tos"><h2>TOS</h2><div class="tos-fields"><input class="text-line" type="text" aria-label="TOS text line 1" data-text-key="tos-text-1"><input class="text-line" type="text" aria-label="TOS text line 2" data-text-key="tos-text-2"></div></section><section class="gallery-section gallery-panel" id="gallery-payment"><h2>Payment</h2><div class="payment-layout"><label class="payment-image image-slot" title="Add image"><span class="image-placeholder" aria-hidden="true">+</span><img alt=""><input data-slot-key="payment-image" type="file" accept="image/*" aria-label="Add Payment image"></label><textarea class="text-line payment-text" aria-label="Payment text" data-text-key="payment-text"></textarea></div></section>
</main></div>
<div class="floatbar" aria-label="Quick entries"><button class="entry" aria-label="Quick entry 1"></button><button class="entry" aria-label="Quick entry 2"></button><button class="entry" aria-label="Quick entry 3"></button></div>
<script>
const d=new Date();document.getElementById('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(d);
const quickForm=document.getElementById('quick'),quickField=quickForm.querySelector('input');quickField.value=localStorage.getItem('wb-quick-actions')??'draw / sleep / read';quickField.placeholder='Write your quick actions';quickField.addEventListener('input',()=>localStorage.setItem('wb-quick-actions',quickField.value));quickForm.addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('wb-quick-actions',quickField.value)});
document.querySelectorAll('.navitem').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('selected'));a.classList.add('selected')}));
document.querySelectorAll('.image-slot').forEach((slot,index)=>{const input=slot.querySelector('input'),img=slot.querySelector('img');input.addEventListener('change',()=>{const file=input.files&&input.files[0];if(!file)return;if(img.dataset.previewUrl)URL.revokeObjectURL(img.dataset.previewUrl);const url=URL.createObjectURL(file);img.dataset.previewUrl=url;img.src=url;slot.classList.add('has-image')})});const dbRequest=indexedDB.open('anh-workbench-library',1);
dbRequest.onupgradeneeded=()=>dbRequest.result.createObjectStore('images');
dbRequest.onsuccess=()=>{const db=dbRequest.result;document.querySelectorAll('.image-slot').forEach((slot,index)=>{const input=slot.querySelector('input'),img=slot.querySelector('img');const read=db.transaction('images','readonly').objectStore('images').get(input.dataset.slotKey||slot.dataset.slotKey||index);read.onsuccess=()=>{if(read.result){img.src=URL.createObjectURL(read.result);slot.classList.add('has-image')}};input.addEventListener('change',()=>{const file=input.files&&input.files[0];if(!file)return;const tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,input.dataset.slotKey||slot.dataset.slotKey||index);tx.oncomplete=()=>{img.src=URL.createObjectURL(file);slot.classList.add('has-image')}})})};
const backgroundFile=document.getElementById('background-file');
let bgOffset={x:Number(localStorage.getItem('wb-bg-x'))||0,y:Number(localStorage.getItem('wb-bg-y'))||0},bgUrl=null,moving=null;function positionBackground(){document.body.style.backgroundPosition='0 0,center center,calc(50% + '+bgOffset.x+'px) calc(50% + '+bgOffset.y+'px)'}function applyBackground(file){if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=URL.createObjectURL(file);document.body.style.backgroundImage='radial-gradient(rgba(255,255,255,.07) .7px,transparent .7px),linear-gradient(rgba(20,18,23,.62),rgba(20,18,23,.72)),url('+bgUrl+')';document.body.style.backgroundSize='8px 8px,cover,cover';document.body.style.backgroundAttachment='fixed,fixed,fixed';document.body.style.backgroundRepeat='repeat,no-repeat,no-repeat';positionBackground();document.body.classList.add('bg-moveable');document.getElementById('move-background').disabled=false}
const backgroundDb=indexedDB.open('anh-workbench-background',1);
backgroundDb.onupgradeneeded=()=>backgroundDb.result.createObjectStore('background');
backgroundDb.onsuccess=()=>{const db=backgroundDb.result;const saved=db.transaction('background','readonly').objectStore('background').get('selected');saved.onsuccess=()=>{if(saved.result)applyBackground(saved.result)};backgroundFile.addEventListener('change',()=>{const file=backgroundFile.files&&backgroundFile.files[0];if(!file)return;const tx=db.transaction('background','readwrite');tx.objectStore('background').put(file,'selected');tx.oncomplete=()=>applyBackground(file)})};
document.getElementById('move-background').addEventListener('click',e=>{const on=document.body.classList.toggle('bg-move-mode');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.title=on?'Drag anywhere to move the background':'Move background: turn on, then drag'});document.addEventListener('pointerdown',e=>{if(!bgUrl||!document.body.classList.contains('bg-move-mode')||e.target.closest('#move-background,.bg-picker,input,button,a,textarea,select'))return;moving={x:e.clientX,y:e.clientY,ox:bgOffset.x,oy:bgOffset.y};document.body.classList.add('bg-moving');e.preventDefault();e.stopPropagation()},true);window.addEventListener('pointermove',e=>{if(!moving)return;bgOffset.x=moving.ox+e.clientX-moving.x;bgOffset.y=moving.oy+e.clientY-moving.y;positionBackground()});window.addEventListener('pointerup',()=>{if(!moving)return;moving=null;document.body.classList.remove('bg-moving');localStorage.setItem('wb-bg-x',bgOffset.x);localStorage.setItem('wb-bg-y',bgOffset.y)});window.addEventListener('pointercancel',()=>{moving=null;document.body.classList.remove('bg-moving')});const navSearch=document.querySelector('.search input');navSearch.setAttribute('placeholder','Search navigation');navSearch.setAttribute('aria-label','Search left navigation');navSearch.addEventListener('input',()=>{const query=navSearch.value.trim().toLocaleLowerCase();document.querySelectorAll('.navgroup').forEach(group=>{let visible=0;group.querySelectorAll('.navitem').forEach(item=>{const match=!query||item.querySelector('.navlabel').textContent.trim().toLocaleLowerCase().includes(query);item.hidden=!match;if(match)visible++});group.hidden=visible===0})});navSearch.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const first=[...document.querySelectorAll('.navitem')].find(item=>!item.hidden);if(first)first.click()}if(e.key==='Escape'){navSearch.value='';navSearch.dispatchEvent(new Event('input'))}});const galleryMain=document.querySelector('.main');
const infoPanel=document.getElementById('gallery-information');
const pricePanel=document.getElementById('gallery-price');
const tosPanel=document.getElementById('gallery-tos');
const paymentPanel=document.getElementById('gallery-payment');
const libraryGrid=document.getElementById('library');
const libraryPanel=document.createElement('section');
libraryPanel.id='panel-library';libraryPanel.className='gallery-section gallery-panel';
const libraryTitle=document.createElement('h2');libraryTitle.textContent='Library';
libraryPanel.append(libraryTitle,libraryGrid);
const galleryView=document.createElement('div');galleryView.className='gallery-view';
const lowerSection=galleryMain.querySelector('.lower');
galleryMain.insertBefore(galleryView,lowerSection);
const galleryPanels={'gallery-information':infoPanel,'panel-library':libraryPanel,'gallery-price':pricePanel,'gallery-tos':tosPanel,'gallery-payment':paymentPanel};
Object.values(galleryPanels).forEach(panel=>{panel.classList.add('gallery-panel');galleryView.appendChild(panel)});
const navPanelByName={Information:'gallery-information',Library:'panel-library',Price:'gallery-price',TOS:'gallery-tos',Payment:'gallery-payment'};
const panelAccents={'gallery-information':'#d09cba','panel-library':'#b883d2','gallery-price':'#9a78a9','gallery-tos':'#ad8bbf','gallery-payment':'#c49ab9'};function showGalleryPanel(id){Object.entries(galleryPanels).forEach(([key,panel])=>{panel.hidden=key!==id});document.querySelectorAll('.navitem').forEach(item=>item.classList.toggle('selected',item.dataset.panel===id));document.body.style.setProperty('--section-accent',panelAccents[id]||'#b883d2');window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navitem').forEach(item=>{const label=item.querySelector('.navlabel').textContent.trim();const panel=navPanelByName[label];item.dataset.panel=panel;if(panel){item.href='#'+panel;item.addEventListener('click',event=>{event.preventDefault();showGalleryPanel(panel)})}});
showGalleryPanel('gallery-information');
document.querySelectorAll('[data-text-key]').forEach(field=>{field.value=localStorage.getItem(field.dataset.textKey)||'';field.addEventListener('input',()=>localStorage.setItem(field.dataset.textKey,field.value))});const libraryRow=document.getElementById('library');[...libraryRow.querySelectorAll('.image-slot')].slice(0,4).forEach((slot,index)=>{const copy=slot.cloneNode(true),input=copy.querySelector('input'),img=copy.querySelector('img');input.dataset.slotKey='library-'+(index+5);input.setAttribute('aria-label','Add image '+(index+5));input.addEventListener('change',()=>{const file=input.files&&input.files[0];if(!file)return;if(img.dataset.previewUrl)URL.revokeObjectURL(img.dataset.previewUrl);const url=URL.createObjectURL(file);img.dataset.previewUrl=url;img.src=url;copy.classList.add('has-image')});libraryRow.appendChild(copy)});
Object.values(galleryPanels).forEach(panel=>{const button=document.createElement('button');button.type='button';button.className='back-top';button.textContent=String.fromCharCode(8593);button.title='Back to top';button.setAttribute('aria-label','Back to top');button.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));panel.appendChild(button)});
const profileFile=document.getElementById('profile-image-file'),profilePreview=document.getElementById('profile-image-preview'),profilePicker=profileFile.closest('.profile-picker');let profileUrl=null;function applyProfile(file){if(profileUrl)URL.revokeObjectURL(profileUrl);profileUrl=URL.createObjectURL(file);profilePreview.src=profileUrl;profilePicker.classList.add('has-profile')}backgroundDb.addEventListener('success',event=>{const db=event.target.result,read=db.transaction('background','readonly').objectStore('background').get('profile');read.onsuccess=()=>{if(read.result)applyProfile(read.result)};profileFile.addEventListener('change',()=>{const file=profileFile.files&&profileFile.files[0];if(!file)return;const tx=db.transaction('background','readwrite');tx.objectStore('background').put(file,'profile');tx.oncomplete=()=>applyProfile(file)})});const contactField=document.getElementById('contact-info');contactField.value=localStorage.getItem('wb-contact-info')||'';contactField.addEventListener('input',()=>localStorage.setItem('wb-contact-info',contactField.value));const shortcutEntries=[['Library','panel-library'],['Price','gallery-price'],['TOS','gallery-tos']];document.querySelectorAll('.entry').forEach((button,index)=>{const shortcut=shortcutEntries[index];if(!shortcut)return;button.textContent=shortcut[0];button.setAttribute('aria-label','Open '+shortcut[0]);button.title='Open '+shortcut[0];button.addEventListener('click',()=>showGalleryPanel(shortcut[1]))});</script>
</body></html>
